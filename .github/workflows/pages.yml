name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push supersedes a running one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Only the canonical repository publishes the site; the mirror just runs CI.
    if: github.repository == 'arcsig-labs/arcflow'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `enablement` below turns Pages on through the API, which needs this.
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The docs app imports the packages from source, so no package build is needed.
      # Links and assets are emitted relative, so the site works at a domain root,
      # under /<repo> on a project page, or in any subfolder. Set BASE_PATH to pin it.
      - name: Build the site
        run: pnpm --filter docs build
      # Tries to turn Pages on for the repository on the first run. The default
      # token can only do that when it is allowed to administer the repository;
      # otherwise this step fails and Pages has to be enabled once by hand
      # (Settings → Pages → Source: GitHub Actions), see docs/release.md.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
